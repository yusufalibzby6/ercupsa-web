[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/uyeler.html"
  to = "/etkinlikler.html"
  status = 301
  force = true

[[redirects]]
  from = "/api/events"
  to = "/.netlify/functions/events"
  status = 200

[[redirects]]
  from = "/api/ticket-design"
  to = "/.netlify/functions/ticket-design"
  status = 200

[[redirects]]
  from = "/form"
  to = "/form.html"
  status = 200

[[redirects]]
  from = "/api/community"
  to = "/.netlify/functions/community"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
