[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/uyeler.html"
  to = "/etkinlikler.html"
  status = 301
  force = true

[[redirects]]
  from = "/api/events"
  to = "/.netlify/functions/events"
  status = 200

[[redirects]]
  from = "/api/admin-auth"
  to = "/.netlify/functions/admin-auth"
  status = 200

[[redirects]]
  from = "/api/admin-users"
  to = "/.netlify/functions/admin-users"
  status = 200

[[redirects]]
  from = "/api/site-content"
  to = "/.netlify/functions/site-content"
  status = 200

[[redirects]]
  from = "/api/registrations"
  to = "/.netlify/functions/registrations"
  status = 200

[[redirects]]
  from = "/api/ticket-design"
  to = "/.netlify/functions/ticket-design"
  status = 200

[[redirects]]
  from = "/api/public-ticket"
  to = "/.netlify/functions/public-ticket"
  status = 200

[[redirects]]
  from = "/api/team"
  to = "/.netlify/functions/team"
  status = 200

[[redirects]]
  from = "/api/statistics"
  to = "/.netlify/functions/statistics"
  status = 200

[[redirects]]
  from = "/api/event-audit"
  to = "/.netlify/functions/event-audit"
  status = 200

[[redirects]]
  from = "/api/yearbooks"
  to = "/.netlify/functions/yearbooks"
  status = 200

[[redirects]]
  from = "/yillik/:yearbookId"
  to = "/.netlify/functions/yearbooks?action=readable&id=:yearbookId"
  status = 200
  force = true

[[headers]]
  for = "/bilet.html"
  [headers.values]
    Cache-Control = "private, no-store"
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[redirects]]
  from = "/form"
  to = "/form.html"
  status = 200

[[redirects]]
  from = "/etkinlik/:eventId"
  to = "/.netlify/functions/event-share?eventId=:eventId"
  status = 200
  force = true

[[redirects]]
  from = "/api/community"
  to = "/.netlify/functions/community"
  status = 200

[[redirects]]
  from = "/api/accounts"
  to = "/.netlify/functions/accounts"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[redirects]]
  from = "/api/raffles"
  to = "/.netlify/functions/raffles"
  status = 200

[[redirects]]
  from = "/api/gate"
  to = "/.netlify/functions/gate"
  status = 200

[[redirects]]
  from = "/api/staff"
  to = "/.netlify/functions/staff"
  status = 200

[[redirects]]
  from = "/api/feedback"
  to = "/.netlify/functions/feedback"
  status = 200

[[headers]]
  for = "/giris.html"
  [headers.values]
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"

[[headers]]
  for = "/giris"
  [headers.values]
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
