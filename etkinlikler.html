<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Etkinlikler | ERCUPSA</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet"><script>tailwind.config={theme:{extend:{colors:{ercupsaRed:'#8B2323',ercupsaDark:'#1A1A1A'}}}}</script><style>body{font-family:Inter,sans-serif;background:#f8fafc}.glass{background:rgba(255,255,255,.9);backdrop-filter:blur(16px);border:1px solid #eee;box-shadow:0 10px 30px rgba(0,0,0,.05)}.btn{background:#8B2323;color:#fff;transition:.25s}.btn:hover{background:#6f1b1b;transform:translateY(-1px)}</style></head><body class="text-gray-800 antialiased">
<nav class="fixed w-full z-50 bg-white/90 backdrop-blur border-b border-gray-200"><div class="max-w-7xl mx-auto px-4"><div class="h-20 flex items-center justify-between"><a href="index.html" class="flex items-center gap-3"><div class="h-12 w-12 rounded-full bg-white flex items-center justify-center overflow-hidden border shadow-sm"><img src="ercupsa.PNG" class="h-full w-full object-cover" alt="ERCUPSA"></div><div><b class="text-xl leading-none block">ERCUPSA</b><span class="text-[10px] text-gray-500 font-semibold tracking-wider">ERCIYES UNIVERSITY</span></div></a><div class="hidden md:flex items-center gap-7 text-sm font-semibold"><a href="index.html" class="hover:text-ercupsaRed">Ana Sayfa</a><a href="hakkimizda.html" class="hover:text-ercupsaRed">Hakkımızda</a><a href="ekip.html" class="hover:text-ercupsaRed">Ekibimiz (20)</a><a href="etkinlikler.html" class="text-ercupsaRed">Etkinlikler</a><a href="galeri.html" class="hover:text-ercupsaRed">Galeri</a><a href="sss.html" class="hover:text-ercupsaRed">SSS</a><a href="https://chat.whatsapp.com/E9Rxa6ikg489pwGOyL0nTy?s=cl&p=i&ilr=2" target="_blank" class="btn px-5 py-2.5 rounded-full"><i class="fa-brands fa-whatsapp mr-2"></i>Bize Katıl</a></div><button id="mobile-menu-button" class="md:hidden text-2xl"><i class="fa-solid fa-bars"></i></button></div></div><div id="mobile-menu" class="hidden md:hidden bg-white border-t p-4 space-y-2"><a class="block p-3" href="index.html">Ana Sayfa</a><a class="block p-3" href="hakkimizda.html">Hakkımızda</a><a class="block p-3" href="ekip.html">Ekibimiz</a><a class="block p-3 font-bold text-ercupsaRed" href="etkinlikler.html">Etkinlikler</a><a class="block p-3" href="galeri.html">Galeri</a><a class="block p-3" href="sss.html">SSS</a></div></nav>
<main class="pt-32 pb-24 max-w-6xl mx-auto px-4"><div class="text-center mb-12"><span class="text-ercupsaRed font-bold text-sm uppercase tracking-widest">ERCUPSA</span><h1 class="text-4xl md:text-5xl font-black mt-2">Etkinlikler & <span class="text-ercupsaRed">Projeler</span></h1><p class="text-gray-500 max-w-2xl mx-auto mt-4">Yaklaşan etkinliklerimizi keşfet, geçmiş etkinliklerden karelere göz at.</p></div><div class="flex justify-center gap-2 mb-8"><button data-filter="upcoming" class="filter px-5 py-2.5 rounded-full bg-ercupsaRed text-white font-bold">Yaklaşan</button><button data-filter="past" class="filter px-5 py-2.5 rounded-full bg-gray-100 font-bold">Geçmiş</button><button data-filter="all" class="filter px-5 py-2.5 rounded-full bg-gray-100 font-bold">Tümü</button></div><div id="events" class="grid gap-6"></div><div id="empty" class="hidden text-center py-16 text-gray-500">Bu kategoride etkinlik bulunmuyor.</div></main><footer class="bg-ercupsaDark text-white py-8 text-center text-sm">&copy; 2026 ERCUPSA</footer>
<script>const mobile=document.getElementById('mobile-menu-button');mobile.onclick=()=>document.getElementById('mobile-menu').classList.toggle('hidden');let events=[];let filter='upcoming';const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('tr-TR',{day:'numeric',month:'long',year:'numeric'});const esc=s=>(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));function render(){const now=new Date().toISOString().slice(0,10);let list=events.filter(e=>filter==='all'||(filter==='upcoming'?e.date>=now:e.date<now)).sort((a,b)=>a.date.localeCompare(b.date));document.getElementById('empty').classList.toggle('hidden',list.length>0);document.getElementById('events').innerHTML=list.map(e=>{const past=e.date<now;return `<article class="glass rounded-3xl overflow-hidden flex flex-col md:flex-row ${past?'opacity-90':''}">${e.poster?`<img src="${e.poster}" class="w-full md:w-64 h-52 md:h-auto object-cover">`:''}<div class="p-6 md:p-8 flex-1"><div class="flex flex-wrap items-center gap-2 mb-3"><span class="px-3 py-1 rounded-full bg-red-50 text-ercupsaRed font-bold text-xs">${esc(e.category)}</span><span class="text-xs text-gray-400"><i class="fa-regular fa-calendar mr-1"></i>${fmt(e.date)}</span></div><h2 class="text-2xl font-black">${esc(e.title)}</h2><p class="text-gray-600 mt-3 leading-relaxed">${esc(e.description)}</p><div class="flex flex-wrap gap-4 text-sm text-gray-500 mt-4">${e.time?`<span><i class="fa-regular fa-clock mr-1"></i>${esc(e.time)}</span>`:''}${e.location?`<span><i class="fa-solid fa-location-dot mr-1"></i>${esc(e.location)}</span>`:''}${e.images?.length?`<a href="galeri.html#event-${encodeURIComponent(e.id)}" class="text-ercupsaRed font-bold"><i class="fa-regular fa-images mr-1"></i>${e.images.length} fotoğraf</a>`:''}</div><div class="mt-6">${!past&&e.registrationUrl?`<a href="form.html?event=${encodeURIComponent(e.id)}" class="btn inline-flex items-center gap-2 px-6 py-3 rounded-xl font-bold"><i class="fa-regular fa-pen-to-square"></i>Kayıt & Detaylar</a>`:past&&e.images?.length?`<a href="galeri.html#event-${encodeURIComponent(e.id)}" class="inline-block bg-gray-100 px-6 py-3 rounded-xl font-bold">Fotoğrafları Gör</a>`:''}</div></div></article>`}).join('')}document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.className='filter px-5 py-2.5 rounded-full bg-gray-100 font-bold');b.className='filter px-5 py-2.5 rounded-full bg-ercupsaRed text-white font-bold';render()});
fetch('/api/events').then(r=>r.json()).then(d=>{events=d.events||[];render()}).catch(()=>{document.getElementById('events').innerHTML='<div class="glass rounded-3xl p-8 text-center text-gray-500">Etkinlikler şu anda yüklenemedi.</div>'});</script></body></html>
